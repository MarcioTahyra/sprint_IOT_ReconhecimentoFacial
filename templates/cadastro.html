<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Autenticação Facial</title>
    <script src="https://cdn.jsdelivr.net/npm/tracking/build/tracking-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tracking/build/data/face-min.js"></script>
    <style>

        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            width: 300px;
            border-top: 5px solid #FFC60A;
        }
        h2 {
            text-align: center;
            color: #FFC60A;
            margin-bottom: 25px;
            font-weight: 300;
        }
        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333333;
            border-radius: 4px;
            background-color: #121212;
            color: #FFFFFF;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #FFC60A;
            box-shadow: 0 0 5px rgba(255, 198, 10, 0.5);
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #FFC60A;
            color: #121212;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s, opacity 0.3s;
        }
        button:hover {
            background-color: #e6b200;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #webcam-video {
            width: 100%;
            height: auto;
            border-radius: 4px;
            background: black;
            display: block;
            margin-bottom: 15px;
            border: 1px solid #333333;
        }
        .link {
            text-align: center;
            margin-top: 20px;
        }
        .link a {
            color: #FFC60A;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>CRIAR CONTA</h2>
        <form id="auth-form" action="/api/cadastro" method="POST">
            <input type="text" name="username" placeholder="Nome de usuário" required>
            <input type="password" name="password" placeholder="Senha" required>

            <video id="webcam-video" autoplay></video>
            <canvas id="webcam-canvas" style="display:none;"></canvas>

            <input type="hidden" name="image_data" id="image_data">

            <button type="submit" id="btn-submit">CADASTRAR</button>
        </form>

        <div class="link">
            Já tem conta? <a href="{{ url_for('login') }}">Fazer Login</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/webcam.js') }}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initWebcam('auth-form', 'webcam-video', 'webcam-canvas', 'image_data', 'btn-submit', '/api/cadastro', '{{ url_for("login") }}');
        });
    </script>
</body>
</html>
