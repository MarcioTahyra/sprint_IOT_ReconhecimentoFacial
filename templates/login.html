<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Autenticação Facial</title>
    <script src="https://cdn.jsdelivr.net/npm/tracking/build/tracking-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tracking/build/data/face-min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #2c3e50; color: #ecf0f1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #34495e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); width: 300px; }
        h2 { text-align: center; color: #ecf0f1; margin-bottom: 25px; }
        input[type="text"], input[type="password"] { width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #4a637a; border-radius: 4px; background-color: #34495e; color: #ecf0f1; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background-color 0.3s; }
        button:hover { background-color: #2980b9; } { position: relative; width: 100%; margin-bottom: 15px; }
        #webcam-video { width: 100%; height: auto; border-radius: 4px; background: black; display: block; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="auth-form" action="/api/login" method="POST">
            <input type="text" name="username" placeholder="Usuário" required>
            <input type="password" name="password" placeholder="Senha" required>


            <video id="webcam-video" autoplay></video>
            <canvas id="webcam-canvas" style="display:none;"></canvas>

            <input type="hidden" name="image_data" id="image_data">

            <button type="submit" id="btn-submit">Entrar</button>
        </form>

        <div class="link">
            Não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se aqui</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/webcam.js') }}"></script>

    <script>
        // Configuração para o login
        document.addEventListener('DOMContentLoaded', () => {
            initWebcam('auth-form', 'webcam-video', 'webcam-canvas', 'image_data', 'btn-submit', '/api/login', '{{ url_for("dashboard") }}');
        });
    </script>
</body>
</html>
